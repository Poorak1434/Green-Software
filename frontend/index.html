<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var el = document.createElement('div');
        el.style.cssText = 'color:red; background:white; z-index:9999; position:absolute; top:0; left:0; padding:20px; font-size:16px; width:100%; word-break:break-all;';
        el.innerText = 'Global Error: ' + message + '\n' + (error && error.stack ? error.stack : '');
        document.body.appendChild(el);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.createElement('div');
        el.style.cssText = 'color:red; background:white; z-index:9999; position:absolute; top:0; left:0; padding:20px; font-size:16px; width:100%; word-break:break-all;';
        el.innerText = 'Unhandled Rejection: ' + event.reason;
        document.body.appendChild(el);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
